<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>OpenMU Browser Stack</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: #111;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        cursor: none;
      }
      canvas#canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1024px;
        height: 768px;
        display: none;
        cursor: none;
      }
      #info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #aaa;
        text-align: center;
        padding: 2rem;
      }
      #info h1 {
        color: #e0e0e0;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }
      #info p {
        max-width: 520px;
        line-height: 1.6;
        margin: 0.4rem 0;
        font-size: 0.9rem;
      }
      #info a {
        color: #6cb4ee;
      }
      #info code {
        background: #222;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.85rem;
      }
      #info .tag {
        display: inline-block;
        margin-top: 1rem;
        padding: 4px 12px;
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 0.75rem;
        color: #888;
      }
      #loading {
        display: none;
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        color: #ccc;
        font-size: 0.85rem;
        text-align: center;
      }
      #loading .bar {
        width: 260px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        margin-top: 0.5rem;
      }
      #loading .bar-fill {
        height: 100%;
        width: 0%;
        background: #6cb4ee;
        border-radius: 3px;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>

    <div id="info">
      <h1>OpenMU Browser Stack</h1>
      <p>Loading WASM client (<code>Main.js</code> / <code>Main.wasm</code>)...</p>
      <p>
        If this message stays on screen, the Emscripten runtime did not reach
        <code>onRuntimeInitialized</code>. Open the browser console for the
        actual failure.
      </p>
      <span class="tag">WebSocket proxy :7100 &middot; Web :8081</span>
    </div>

    <div id="loading">
      <span id="load-text">Loading...</span>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>

    <script>
      var PROXY_WS_URL = "ws://127.0.0.1:7100";

      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled Rejection:', event.promise);
        console.error('Reason:', event.reason);
        if (event.reason && event.reason.name === 'ExitStatus') {
          console.error('ExitStatus value:', event.reason.status);
        }
      });

      var Module = {
        diag: /[?&]diag(?:=|&|$)/.test(window.location.search),

        locateFile: function(path, prefix) {
          if (path.endsWith('.data')) return path + '?v=20260808c';
          if (path.endsWith('.wasm')) return 'Main.wasm?v=20260810_mobile9';
          return prefix + path;
        },
        canvas: document.getElementById("canvas"),

        websocket: { url: PROXY_WS_URL },

        print: function (t) {
          console.log(t);
        },
        printErr: function (t) {
          console.error(t);
        },

        setStatus: function (text) {
          if (!text) {
            document.getElementById("loading").style.display = "none";
            return;
          }
          document.getElementById("loading").style.display = "block";
          document.getElementById("load-text").textContent = text;
          var m = text.match(/(\d+)\/(\d+)/);
          if (m) {
            document.getElementById("bar-fill").style.width =
              (parseInt(m[1]) / parseInt(m[2])) * 100 + "%";
          }
        },

        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Loading... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "",
          );
        },

        onRuntimeInitialized: function () {
  document.getElementById("info").style.display = "none";
  document.getElementById("canvas").style.display = "block";
  console.log("[OpenMU] WASM runtime initialized");
  requestAnimationFrame(function () {
    gameReady = true;
    fitGameCanvas();
    setTimeout(fitGameCanvas, 300);
    setTimeout(fitGameCanvas, 1000);
  });
},
      };

      // --- Enquadramento responsivo: o framebuffer fica SEMPRE no nativo
      // 4:3 do jogo (1024x768, config.ini) e só a apresentação (CSS) escala
      // de forma uniforme e centralizada (letterbox) para caber na janela.
      //
      // POR QUE NÃO REDIMENSIONAR O BITMAP: o jogo só muda a viewport ao
      // receber SDL_EVENT_WINDOW_RESIZED, e esse caminho (HandleWindowResize
      // → ReinitializeFonts/CreateFontW) estoura memória no build WASM
      // atual (RuntimeError: memory access out of bounds em wasm-function
      // [647]) — resultando em tela preta. Redimensionar o bitmap SEM o jogo
      // saber deixa a cena presa num canto (viewport nativa num canvas
      // maior). Manter o bitmap nativo evita os dois: o jogo renderiza
      // 1024x768 por inteiro e o CSS enquadra sem distorção. ---
      var GAME_W = 1024;
      var GAME_H = 768;
      var gameReady = false;

      function fitGameCanvas() {
        var canvas = document.getElementById("canvas");
        if (!canvas) return;

        // Framebuffer nativo fixo (o SDL/WASM também o define assim).
        if (canvas.width !== GAME_W || canvas.height !== GAME_H) {
          canvas.width = GAME_W;
          canvas.height = GAME_H;
        }

        // Escala uniforme 4:3 (letterbox) — sem esticar/comprimir; a
        // centralização vem do CSS (top/left 50% + translate(-50%,-50%)).
        var scale = Math.min(
          window.innerWidth / GAME_W,
          window.innerHeight / GAME_H,
        );
        var newW = Math.max(1, Math.round(GAME_W * scale));
        var newH = Math.max(1, Math.round(GAME_H * scale));
        canvas.style.width = newW + "px";
        canvas.style.height = newH + "px";
      }

      window.addEventListener("resize", function () {
        if (gameReady) fitGameCanvas();
      });
      window.addEventListener("orientationchange", function () {
        if (gameReady) fitGameCanvas();
      });
    </script>

    <script async src="Main.js?v=20260810_mobile9"></script>
    <script src="hud-mobile.js?v=20260809m7"></script>
    <script src="touch-controls.js?v=20260810m9"></script>
  </body>
</html>
