<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenMU Browser Stack</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        background: #111;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        cursor: none;
      }
      canvas#canvas {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 1024px;
        height: 768px;
        display: none;
        cursor: none;
      }
      #info {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #aaa;
        text-align: center;
        padding: 2rem;
      }
      #info h1 {
        color: #e0e0e0;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }
      #info p {
        max-width: 520px;
        line-height: 1.6;
        margin: 0.4rem 0;
        font-size: 0.9rem;
      }
      #info a {
        color: #6cb4ee;
      }
      #info code {
        background: #222;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 0.85rem;
      }
      #info .tag {
        display: inline-block;
        margin-top: 1rem;
        padding: 4px 12px;
        border: 1px solid #444;
        border-radius: 4px;
        font-size: 0.75rem;
        color: #888;
      }
      #loading {
        display: none;
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        color: #ccc;
        font-size: 0.85rem;
        text-align: center;
      }
      #loading .bar {
        width: 260px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        margin-top: 0.5rem;
      }
      #loading .bar-fill {
        height: 100%;
        width: 0%;
        background: #6cb4ee;
        border-radius: 3px;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <canvas
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>

    <div id="info">
      <h1>OpenMU Browser Stack</h1>
      <p>Loading WASM client (<code>Main.js</code> / <code>Main.wasm</code>)...</p>
      <p>
        If this message stays on screen, the Emscripten runtime did not reach
        <code>onRuntimeInitialized</code>. Open the browser console for the
        actual failure.
      </p>
      <span class="tag">WebSocket proxy :7100 &middot; Web :8081</span>
    </div>

    <div id="loading">
      <span id="load-text">Loading...</span>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>

    <script>
      var PROXY_WS_URL = "ws://127.0.0.1:7100";

      window.addEventListener('unhandledrejection', function(event) {
        console.error('Unhandled Rejection:', event.promise);
        console.error('Reason:', event.reason);
        if (event.reason && event.reason.name === 'ExitStatus') {
          console.error('ExitStatus value:', event.reason.status);
        }
      });

      var Module = {
        diag: /[?&]diag(?:=|&|$)/.test(window.location.search),

        locateFile: function(path, prefix) {
          if (path.endsWith('.data')) return path + '?v=20260808c';
          if (path.endsWith('.wasm')) return 'Main.wasm?v=20260808c';
          return prefix + path;
        },
        canvas: document.getElementById("canvas"),

        websocket: { url: PROXY_WS_URL },

        print: function (t) {
          console.log(t);
        },
        printErr: function (t) {
          console.error(t);
        },

        setStatus: function (text) {
          if (!text) {
            document.getElementById("loading").style.display = "none";
            return;
          }
          document.getElementById("loading").style.display = "block";
          document.getElementById("load-text").textContent = text;
          var m = text.match(/(\d+)\/(\d+)/);
          if (m) {
            document.getElementById("bar-fill").style.width =
              (parseInt(m[1]) / parseInt(m[2])) * 100 + "%";
          }
        },

        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(
            left
              ? "Loading... (" +
                  (this.totalDependencies - left) +
                  "/" +
                  this.totalDependencies +
                  ")"
              : "",
          );
        },

        onRuntimeInitialized: function () {
  document.getElementById("info").style.display = "none";
  document.getElementById("canvas").style.display = "block";
  console.log("[OpenMU] WASM runtime initialized");
  requestAnimationFrame(function () {
    gameReady = true;
    fitGameCanvas();
    setTimeout(fitGameCanvas, 300);
    setTimeout(fitGameCanvas, 1000);
  });
},
      };

      // --- Resolução dinâmica: o canvas real (bitmap) cresce/encolhe para
      // caber na janela do navegador, mantendo a proporção nativa 4:3 do
      // jogo (1024x768) com letterbox quando necessário. Sem teto
      // artificial: pode crescer além do nativo em janelas grandes.
      // Validado: numa janela 1167x909 o canvas mediu 1167x875 (1.334≈4:3).
      // NÃO usa evento "resize" sintético — o SDL3/WASM detecta a mudança
      // do canvas sozinho; dispatch sintético já causou problemas. ---
      var GAME_W = 1024;
      var GAME_H = 768;
      var gameReady = false;

      function fitGameCanvas() {
        var canvas = document.getElementById("canvas");
        if (!canvas) return;

        // Maior retângulo 4:3 que cabe na janela (letterbox).
        var ratio = GAME_W / GAME_H;
        var w = window.innerWidth;
        var h = window.innerHeight;

        var newW, newH;
        if (w / h > ratio) {
          newH = h;
          newW = Math.round(h * ratio);
        } else {
          newW = w;
          newH = Math.round(w / ratio);
        }

        // Redimensiona o bitmap REAL (canvas.width/height, não só CSS) —
        // o jogo acompanha e renderiza nessa resolução.
        canvas.width = newW;
        canvas.height = newH;
        canvas.style.width = newW + "px";
        canvas.style.height = newH + "px";
      }

      window.addEventListener("resize", function () {
        if (gameReady) fitGameCanvas();
      });
      window.addEventListener("orientationchange", function () {
        if (gameReady) fitGameCanvas();
      });
    </script>

    <script async src="Main.js?v=20260808_char_fov54"></script>
    <script src="hud-mobile.js"></script>
    <script src="touch-controls.js"></script>
  </body>
</html>
